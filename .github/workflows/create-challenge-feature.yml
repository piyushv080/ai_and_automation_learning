
name: Create Challenge - Feature Branch

on:
  push:
    branches:
      - feature/100-days-of-code
    paths:
      - ".github/scripts/100_days_of_code/**"
      - ".github/workflows/create-challenge-feature.yml"
      - "curriculum/**"
      - "docs/100-days-of-code/**"

permissions:
  contents: read
  issues: write

jobs:
  create-challenge:
    name: Create Next Challenge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dispatcher syntax
        run: |
          python -m py_compile \
            .github/scripts/100_days_of_code/challenge_dispatcher.py

      - name: Create GitHub challenge issue
        run: |
          python .github/scripts/100_days_of_code/challenge_dispatcher.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
