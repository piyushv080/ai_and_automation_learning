
name: Test 100 Days of Code - Feature Branch

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test-dispatcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: feature/100-days-of-code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            .github/scripts/100_days_of_code/challenge_dispatcher.py

      - name: Validate curriculum
        run: |
          python -c "
          import json
          with open('curriculum/index.json') as f:
              data = json.load(f)
          print('Total challenges:', len(data['challenges']))
          for challenge in data['challenges']:
              print(challenge['day'], challenge['title'])
          "
