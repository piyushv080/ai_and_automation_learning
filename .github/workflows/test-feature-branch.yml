
name: 100 Days of Code - Feature Branch Validation

on:
  push:
    branches:
      - feature/100-days-of-code
    paths:
      - ".github/scripts/100_days_of_code/**"
      - ".github/workflows/**"
      - "curriculum/**"
      - "docs/**"
      - "solutions/**"
      - "tests/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "pytest.ini"
      - "pytest.ini"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Feature Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile automation scripts
        run: |
          python -m compileall -q .github/scripts/100_days_of_code

      - name: Validate curriculum JSON
        run: |
          python -m json.tool curriculum/index.json > /dev/null

      - name: Run pytest
        run: |
          python -m pytest -v

      - name: Build Zensical website
        run: |
          zensical build --strict
