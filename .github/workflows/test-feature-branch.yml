
name: 100 Days of Code - Feature Branch Validation

on:
  push:
    branches:
      - feature/100-days-of-code
    paths:
      - ".github/scripts/100_days_of_code/**"
      - ".github/workflows/test-feature-branch.yml"
      - "curriculum/**"
      - "docs/100-days-of-code/**"
      - "tests/**"
      - "solutions/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "pytest.ini"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python, Curriculum and Documentation
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------
      # 1. Checkout feature branch
      # -----------------------------------------------

      - name: Checkout feature branch
        uses: actions/checkout@v4

      # -----------------------------------------------
      # 2. Configure Python
      # -----------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # -----------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install pytest
        run: |
          python -m pip install "pytest>=8.0,<10.0"

      # -----------------------------------------------
      # 4. Display environment
      # -----------------------------------------------

      - name: Display Python and pytest versions
        run: |
          python --version
          python -m pytest --version

      # -----------------------------------------------
      # 5. Validate Python syntax
      # -----------------------------------------------

      - name: Compile automation scripts
        run: |
          python -m py_compile \
            .github/scripts/100_days_of_code/challenge_dispatcher.py

          if [ -f .github/scripts/100_days_of_code/submission_validator.py ]; then
            python -m py_compile \
              .github/scripts/100_days_of_code/submission_validator.py
          fi

          if [ -f .github/scripts/100_days_of_code/progress_tracker.py ]; then
            python -m py_compile \
              .github/scripts/100_days_of_code/progress_tracker.py
          fi

      # -----------------------------------------------
      # 6. Validate curriculum JSON
      # -----------------------------------------------

      - name: Validate curriculum JSON
        run: |
          python -m json.tool curriculum/index.json > /dev/null
          echo "Curriculum JSON is valid."

      # -----------------------------------------------
      # 7. Run pytest
      # -----------------------------------------------

      - name: Run curriculum and project tests
        run: |
          python -m pytest -v

      # -----------------------------------------------
      # 8. Validate MkDocs configuration and build
      # -----------------------------------------------

      - name: Build MkDocs website
        run: |
          python -m mkdocs build --strict

      # -----------------------------------------------
      # 9. Final result
      # -----------------------------------------------

      - name: Validation summary
        if: success()
        run: |
          echo "===================================="
          echo "FEATURE BRANCH VALIDATION PASSED"
          echo "===================================="
          echo "Python syntax: PASSED"
          echo "Curriculum JSON: PASSED"
          echo "Pytest: PASSED"
          echo "MkDocs build: PASSED"
          echo "===================================="
