
name: Test 100 Days of Code - Feature Branch

on:
  push:
    branches:
      - feature/100-days-of-code

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dispatcher:
    name: Validate Feature Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            .github/scripts/100_days_of_code/challenge_dispatcher.py

      - name: Validate curriculum
        run: |
          python -c "
          import json

          with open('curriculum/index.json', encoding='utf-8') as f:
              data = json.load(f)

          print('Total challenges:', len(data['challenges']))

          for challenge in data['challenges']:
              print(challenge['day'], challenge['title'])
          "