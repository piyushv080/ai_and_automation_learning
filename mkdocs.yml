site_name: AI & Automation Learning
site_description: Personal notes and projects for learning AI, Python, and automation
docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Scripting:
      - scripting/index.md
      - Python:
          - Basics: python-basics.md
          - Infrastructure Automation: python-infrastructure-automation.md
      - PowerShell: scripting/powershell.md
      - Bash and Shell: scripting/bash.md
      - JavaScript: scripting/javascript.md
  - Cloud Infrastructure:
      - cloud/index.md
      - Linux Foundations: linux-notes.md
      - Networking Foundations: networking-notes.md
  - Automation Technologies:
      - automation/index.md
      - Ansible, AWX, and Automation Platform: ansible-awx.md
      - Terraform Foundations: automation/terraform.md
  - DevOps Engineering:
      - devops/index.md
      - Security and Observability: security-observability.md
  - Projects:
      - projects/index.md
  - Documentation:
      - documentation/index.md
      - Project README Template: examples/README.md
      - Runbook Template: documentation/runbook-template.md
  - AI: ai/index.md

theme:
  variant: modern
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  icon:
    logo: material/book-open-page-variant
  palette:
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: lucide/sun
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: lucide/moon
        name: Switch to dark mode

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
