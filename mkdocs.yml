site_name: Automation & Platform Engineering
site_description: Practical learning resources for scripting, AI automation, cloud infrastructure, DevOps, and platform engineering.
docs_dir: docs
site_dir: site

nav:
  - Home: index.md

  - Scripting:
      - Scripting: scripting/scripting.md
      - Python:
          - Python Basic: scripting/python-basic.md
          - Python Advanced: scripting/python-advanced.md
          - Python Library: scripting/python-library.md
          - Practice Programs: scripting/python-programs.md
      - PowerShell: scripting/powershell.md
      - Bash and Shell: scripting/bash.md

  - DevOps & Infrastructure as Code:
      - DevOps & Infrastructure as Code: devops/devops-engineering.md
      - Operating System & Networking:
          - Overview: devops/os-networking.md
          - Linux Foundations: devops/cloud/linux-notes.md
          - Networking Foundations: devops/cloud/networking-notes.md

      - Git SCM:
          - Overview: devops/git-scm.md
          - Git Guide: devops/git-guide.md
          - CI/CD with GitHub Actions: devops/cicd_on_github_action.md
          
      - Infrastructure as Code:
          - Overview: devops/infrastructure-as-code.md
          - Cloud Infrastructure: devops/cloud/cloud-infrastructure.md
          - Terraform Foundations: devops/automation/terraform.md

      - Containers & Orchestration:
          - Overview: devops/containers-orchestration.md
          - Docker Commands Cheat Sheet: devops/docker-guide.md
          - Kubernetes Guide: devops/kubernetes-guide.md

      - Automation Technologies:
          - Overview: devops/automation/automation-technologies.md
          - Ansible, AWX, and Automation Platform: devops/automation/ansible-awx.md
          - Ansible Automation Notes: devops/automation/ansible_automation.md
          - Ansible Best Practices: devops/automation/ansible-best-practices.md
          - AWX Ansible Setup: devops/automation/install-awx-ansible.md
          - Ansible Guide: devops/ansible-guide.md

      - Observability & Security:
          - Overview: devops/observability-security.md
          - Prometheus and Grafana Guide: devops/prometheus-grafana-guide.md
          - Security and Observability: devops/security-observability.md

  - ServiceNow:
      - JavaScript on the Now Platform: ServiceNow/javascript-1.md
      - Glide APIs: ServiceNow/glide-apis.md
      - Client-Side Scripting: ServiceNow/client-side-scripting.md
      - Server-Side Scripting: ServiceNow/server-side-scripting.md
      - Flow Designer and Knowledge Management: ServiceNow/flow-designer-and-knowledge.md

theme:
  variant: modern
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow

  icon:
    logo: material/book-open-page-variant

  palette:
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: lucide/sun
        name: Switch to light mode

    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: lucide/moon
        name: Switch to dark mode

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css