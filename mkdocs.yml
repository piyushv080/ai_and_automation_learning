theme:
  variant: modern
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow

  icon:
    logo: material/book-open-page-variant

  palette:
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: lucide/sun
        name: Switch to light mode

    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: lucide/moon
        name: Switch to dark mode

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css